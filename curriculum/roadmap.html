<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DE → Systems → Inference — Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c;
    --surface:#1b2027;
    --surface-2:#232a33;
    --line:#2b333d;
    --text:#e7e4dc;
    --muted:#8b93a0;
    --muted-2:#5d6672;
    --de:#6fa8a8;      /* data engineering */
    --de-dim:#3d5959;
    --sys:#c98a4a;     /* systems */
    --sys-dim:#5c4630;
    --ai:#8c8fd1;      /* AI / inference */
    --ai-dim:#464a72;
    --meta:#b5b09a;    /* portfolio / meta */
    --meta-dim:#524f43;
    --done:#7fb88a;
    --done-dim:#334a38;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:inherit;}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;}

  header.top{
    border-bottom:1px solid var(--line);
    padding:18px 24px 14px 24px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--surface), var(--bg));
  }
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .title-block h1{
    font-size:19px;margin:0 0 4px 0;font-weight:600;letter-spacing:0.2px;
  }
  .title-block .strategy{
    font-size:13px;color:var(--muted);max-width:640px;line-height:1.5;margin:0;
  }
  .title-block .mono.tag{
    font-size:11px;color:var(--muted-2);letter-spacing:.03em;
  }

  .overall-progress{
    text-align:right;min-width:180px;
  }
  .overall-progress .num{font-family:'IBM Plex Mono';font-size:26px;font-weight:600;}
  .overall-progress .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .bar-track{
    height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px;width:180px;margin-left:auto;
  }
  .bar-fill{height:100%;background:var(--done);border-radius:99px;transition:width .4s ease;}

  /* allocation strip */
  .alloc{
    margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .alloc-label{font-size:11px;color:var(--muted-2);letter-spacing:.03em;white-space:nowrap;}
  .alloc-bar{
    display:flex;height:10px;border-radius:99px;overflow:hidden;flex:1;min-width:220px;max-width:420px;background:var(--surface-2);
  }
  .alloc-seg{height:100%;}
  .alloc-toggle{
    display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:6px;
  }
  .alloc-toggle button{
    border:none;background:transparent;color:var(--muted);font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer;font-family:'IBM Plex Mono';
  }
  .alloc-toggle button.active{background:var(--surface);color:var(--text);}
  .alloc-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .alloc-legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  nav.tabs{
    display:flex;gap:2px;margin-top:16px;border-bottom:1px solid transparent;
  }
  nav.tabs button{
    background:transparent;border:none;color:var(--muted);padding:7px 14px;font-size:12.5px;cursor:pointer;
    font-family:'IBM Plex Mono';border-bottom:2px solid transparent;letter-spacing:.02em;
  }
  nav.tabs button.active{color:var(--text);border-bottom:2px solid var(--done);}
  nav.tabs button:hover{color:var(--text);}

  /* ---------- body layout ---------- */
  .body{flex:1;display:flex;min-height:0;}

  /* sidebar */
  aside{
    width:308px;flex-shrink:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--surface);
  }
  .filter-row{
    display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .filter-chip{
    font-family:'IBM Plex Mono';font-size:10.5px;padding:4px 9px;border-radius:99px;
    border:1px solid var(--line);color:var(--muted);cursor:pointer;background:transparent;letter-spacing:.02em;
  }
  .filter-chip.active{color:var(--bg);border-color:transparent;}
  .phase-list{overflow-y:auto;flex:1;padding:6px;}
  .phase-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);cursor:pointer;
    border-left:2px solid transparent;
  }
  .phase-item:hover{background:var(--surface-2);}
  .phase-item.active{background:var(--surface-2);border-left:2px solid var(--done);}
  .phase-item .idx{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted-2);width:30px;flex-shrink:0;}
  .phase-item .name{font-size:12.5px;flex:1;line-height:1.35;}
  .prio-pill{font-family:'IBM Plex Mono';font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex-shrink:0;}
  .prio-pill.prio-required{color:var(--de);border-color:var(--de);}
  .prio-pill.prio-deep{color:var(--muted-2);}
  .slice-line{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);margin:4px 0 12px;}
  .phase-item .pct{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);flex-shrink:0;}
  .track-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

  /* main */
  main{flex:1;overflow-y:auto;padding:28px 40px 60px 40px;min-width:0;}
  .phase-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px;}
  .phase-eyebrow{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);margin-bottom:6px;letter-spacing:.02em;}
  .phase-header h2{font-size:24px;margin:0;font-weight:600;max-width:640px;line-height:1.3;}
  .badge{
    font-family:'IBM Plex Mono';font-size:11px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .goal{color:var(--muted);font-size:14px;line-height:1.6;margin:14px 0 22px 0;max-width:680px;}

  section.block{margin-bottom:26px;max-width:720px;}
  section.block h3{
    font-size:11px;text-transform:none;letter-spacing:.03em;color:var(--muted-2);margin:0 0 10px 0;font-family:'IBM Plex Mono';font-weight:500;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }

  .focus-tags{display:flex;flex-wrap:wrap;gap:7px;}
  .focus-tag{
    font-size:12px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:5px;color:var(--text);
  }

  .ignore-note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--sys-dim);padding:8px 12px;background:var(--surface);border-radius:0 4px 4px 0;}

  .res-list{display:flex;flex-direction:column;gap:8px;}
  .res-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:5px;text-decoration:none;
  }
  .res-item:hover{border-color:var(--muted-2);}
  .res-item .r-name{font-size:13px;}
  .res-item .r-go{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);}

  .seq-list{display:flex;flex-direction:column;gap:0;}
  .seq-row{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);}
  .seq-row:last-child{border-bottom:none;}
  .seq-row .seq-num{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);width:18px;flex-shrink:0;padding-top:2px;
  }
  .seq-row .seq-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .seq-col-label{
    font-family:'IBM Plex Mono';font-size:9.5px;color:var(--muted-2);letter-spacing:.06em;display:block;margin-bottom:5px;
  }
  .seq-pill-wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .seq-pill{
    padding:5px 10px;border-radius:5px;background:var(--surface);border:1px solid var(--line);line-height:1.4;
    font-size:12.5px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  }
  .seq-pill.rp{color:var(--text);}
  .seq-pill.rp:hover{border-color:var(--de);}
  .seq-pill.fb{color:var(--text);background:var(--surface-2);}
  .seq-pill.fb:hover{border-color:var(--ai);}
  .seq-pill-empty{color:var(--muted-2);background:transparent;border-style:dashed;cursor:default;}
  .seq-pill-internal{border-style:dashed;}
  .seq-go{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);}
  .seq-arrow-row{color:var(--muted-2);font-family:'IBM Plex Mono';font-size:11px;padding-left:2px;}
  .seq-note{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:2px;}

  .checklist{display:flex;flex-direction:column;gap:2px;}
  .check-row{
    display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:4px;cursor:pointer;
  }
  .check-row:hover{background:var(--surface);}
  .check-row input{
    appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--muted-2);border-radius:4px;
    margin-top:1px;flex-shrink:0;cursor:pointer;position:relative;background:var(--surface);
  }
  .check-row input:checked{background:var(--done);border-color:var(--done);}
  .check-row input:checked::after{
    content:"";position:absolute;left:5px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .check-row span{font-size:13.5px;line-height:1.5;}
  .check-row.checked span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2);}

  .time-est{font-size:12px;color:var(--muted-2);margin-top:2px;}

  /* system tab */
  .sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:920px;}
  @media(max-width:900px){.sys-grid{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;}
  .card h4{margin:0 0 10px 0;font-size:13px;font-family:'IBM Plex Mono';color:var(--text);font-weight:500;}
  .card ol,.card ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.7;}
  .card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 8px 0;}
  .cycle-flow{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);line-height:2.1;white-space:pre;}

  .tier-list{display:flex;flex-direction:column;gap:14px;}
  .tier{display:flex;gap:14px;align-items:flex-start;}
  .tier .tnum{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);width:78px;flex-shrink:0;padding-top:2px;}
  .tier .titems{display:flex;flex-wrap:wrap;gap:6px;}
  .tier .titem{font-size:11.5px;background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:4px;color:var(--muted);}

  /* prompts tab */
  .prompt-card{max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:20px;overflow:hidden;}
  .prompt-card .p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
  .prompt-card .p-head h4{margin:0;font-size:13px;font-family:'IBM Plex Mono';}
  .copy-btn{
    font-family:'IBM Plex Mono';font-size:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:6px 11px;border-radius:5px;cursor:pointer;
  }
  .copy-btn:hover{border-color:var(--muted-2);}
  .copy-btn.copied{color:var(--done);border-color:var(--done-dim);}
  .prompt-card pre{
    margin:0;padding:16px 18px;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);line-height:1.7;
    white-space:pre-wrap;max-height:340px;overflow-y:auto;
  }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:99px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--line);}

  .empty-hint{color:var(--muted-2);font-size:12px;padding:40px;text-align:center;}

  /* FB primary curriculum (Phase 0) */
  .fb-primary-banner{
    display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:11px;color:var(--done);
    background:var(--done-dim);border-radius:5px;padding:7px 12px;margin-bottom:14px;width:fit-content;
  }
  .fb-step{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:10px;overflow:hidden;}
  .fb-step-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .fb-step-num{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);}
  .fb-step-title{font-size:13.5px;font-weight:600;flex:1;}
  .fb-step-open{
    font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 9px;
    border:1px solid var(--line);border-radius:5px;white-space:nowrap;
  }
  .fb-step-open:hover{border-color:var(--ai);color:var(--text);}
  .fb-step-body{padding:12px 14px;}
  .fb-watch-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
  .fb-watch-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .fb-watch-row .fb-dur{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted-2);flex-shrink:0;min-width:44px;}
  .fb-optional-note{font-size:11.5px;color:var(--muted-2);margin-bottom:6px;font-style:italic;}
  .fb-skip-note{font-size:11.5px;color:var(--muted-2);padding-top:8px;border-top:1px dashed var(--line);line-height:1.6;}
  .fb-skip-note b{color:var(--muted);}
  .fb-step-total{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--done);margin-top:6px;}
  .fb-extra-note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px;background:var(--surface-2);padding:8px 10px;border-radius:4px;}

  .filler-hint{font-size:12px;color:var(--muted-2);margin-bottom:10px;line-height:1.5;}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
/* ======================= DATA ======================= */

const TRACKS = {
  DE:   {label:"DE / AE", color:"var(--de)",   dim:"var(--de-dim)"},
  SYS:  {label:"Systems",          color:"var(--sys)",  dim:"var(--sys-dim)"},
  AI:   {label:"AI on data / ML",   color:"var(--ai)",   dim:"var(--ai-dim)"},
  META: {label:"Career", color:"var(--meta)", dim:"var(--meta-dim)"},
};

const PHASES = [
{id:"p0",track:"DE",time:"2–3 weeks",title:"Python Engineering Foundation",
 goal:"Move from functional Python to engineering-grade Python. Educative's \"Learn Python 3: Comprehensive Programming Guide\" is now the PRIMARY resource — a single interactive, code-in-browser course (238 lessons, ~16h, 3 graded projects) instead of a curated video playlist, which matters because the actual gap is reps/retrieval, not comprehension. Fluent Python (2nd Edition) is a deep reference — read a chapter only when a concept needs more depth than the course gives it, never as a course to finish. Real Python is a small filler list for the couple of things Educative doesn't explicitly cover (regex depth, profiling).",
 focus:["object model & mutability","functions & scope","comprehensions & functional tools","modules & classes","error handling & testing","iterators & generators","files & APIs & databases","packaging & environments","GIL & concurrency (0.11)"],
 resources:[
   {n:"★ PRIMARY — Educative: Learn Python 3 — Comprehensive Programming Guide", u:"https://www.educative.io/courses/learn-python-3-complete-guide"},
 ],
 coursePlan:[
   {section:"Variables, Types, and Expressions (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — variables, types, strings, operators, user input", dur:"13 lessons"}],
    skipNote:"Straightforward if you already know Python syntax, but the course is only ~4 min/lesson on average — cheap enough to skim in full rather than guess what to skip."},

   {section:"Data Collections (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — lists, tuples, dictionaries, sets and their operations", dur:"13 lessons"}]},

   {section:"Functions and Scope (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — function creation, variable scope, closures", dur:"13 lessons"}]},

   {section:"Comprehensions and Functional Tools (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — list/dict/set comprehensions, map/filter/reduce-style tools", dur:"13 lessons"}],
    optional:[{n:"Breakout Session: Python Fundamentals mock interview (Control Flow, Data Structures, Functions, Scope)", dur:"—"}]},

   {section:"Project — The QuickCart Inventory Manager", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide/the-quickcart-inventory-manager/project",
    watch:[{n:"Build the project yourself before checking any reference solution", dur:"project"}],
    skipNote:"This is the checkpoint for everything above — data structures + functions + comprehensions applied to one real program, not three separate toy scripts."},

   {section:"The Python Object Model (12 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — identity, mutability, and behavior", dur:"12 lessons"}],
    skipNote:"This is the memory-model equivalent (references vs values, shared mutable state) — do not skip any of it, it's the single highest-value section for avoiding real production bugs."},

   {section:"Organizing Code with Modules (10 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — module creation, using the standard library", dur:"10 lessons"}]},

   {section:"Creating and Using Classes (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — class design, encapsulation, attributes, methods", dur:"13 lessons"}]},

   {section:"Object Relationships and Data Model (12 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — composition, inheritance, data management", dur:"12 lessons"}],
    optional:[{n:"Breakout Session: Python Object Models mock interview (Classes, State Management, System Architecture)", dur:"—"}]},

   {section:"Error Handling and Debugging (13 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — exceptions, logging, custom exception hierarchies", dur:"13 lessons"}],
    skipNote:"Maps directly to the custom-exception rep exercise (PipelineError → SchemaError/SourceUnavailableError/etc.) — don't cherry-pick this one."},

   {section:"Testing and Code Quality (11 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — automated testing techniques", dur:"11 lessons"}]},

   {section:"Working with Files (12 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — text, binary, and JSON file operations", dur:"12 lessons"}]},

   {section:"Iterators and Generators (11 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — iterator protocol, generators, lazy evaluation", dur:"11 lessons"}]},

   {section:"Project — BiblioTech: The Robust Library Manager", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide/bibliotech-the-robust-library-manager/project",
    watch:[{n:"Build it yourself first", dur:"project"}],
    skipNote:"The best rep in the whole course for \"process a large file lazily\" and \"write an ETL script\" — close to real ETL work, not a toy example."},

   {section:"Working with Data and APIs (11 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — HTTP requests, SQLite for resilient data management", dur:"11 lessons"}],
    skipNote:"This is what the old Real Python filler (requests/API/sqlite3 articles) existed for — now covered inside the primary course instead."},

   {section:"Managing Packages and Environments (8 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — package organization, configuration management, virtual environments", dur:"8 lessons"}]},

   {section:"Parallel and Concurrent Programming (11 lessons) — survey layer only", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — the mental-model layer only", dur:"11 lessons"}],
    skipNote:"Do this section for orientation, then go to Phase 0.11 for the actual depth (dedicated concurrency course) — don't try to get GIL/threading/multiprocessing fluency from these 11 lessons alone."},

   {section:"Asynchronous Programming (12 lessons) — survey layer only", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — the mental-model layer only", dur:"12 lessons"}],
    optional:[{n:"Breakout Session: Python Concurrency Models mock interview (I/O, Parallelism, Async Execution)", dur:"—"}],
    skipNote:"Same logic as above — asyncio depth lives in Phase 0.11, not here."},

   {section:"Advanced Functions and Decorators (11 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — higher-order functions, decorators, context managers", dur:"11 lessons"}],
    skipNote:"This is the crown-jewel section for this course — the direct equivalent of what used to be Fred Baptiste's \"Scopes, Closures and Decorators.\" Do the @retry/@timeit/@log_call rep exercise right after this section."},

   {section:"Building and Distributing Applications (11 lessons)", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide",
    watch:[{n:"Full section — CLI tools, project structuring, packaging, versioning", dur:"11 lessons"}]},

   {section:"Project — FactStorm CLI", courseUrl:"https://www.educative.io/courses/learn-python-3-complete-guide/factstorm-cli/project",
    watch:[{n:"Build it yourself first", dur:"project"}],

I am learning:
[TOPIC]

The specific concept I just studied is:
[CONCEPT]

Primary resource I used:
[RESOURCE]

My own explanation:
[MY EXPLANATION]

My implementation / code, if applicable:
[CODE]

Your job is NOT to teach the topic from scratch and NOT to immediately give me the answer.
Your job is to determine whether I actually understand it.

Follow this protocol strictly:

1. RETRIEVAL FIRST — Ask me 3–7 questions testing recall without notes, simple to hard.
2. MECHANISM — what it is, why it exists, how it works internally, what assumptions it makes.
3. IMPLEMENTATION — have me implement/modify a small example without giving the solution first.
4. EDGE CASES — 2–5 realistic failure scenarios; don't explain until I attempt them.
5. TRADE-OFFS — when to use it, when to avoid it, alternatives, performance/reliability/operational cost.
6. DEBUGGING — one realistic broken implementation/architecture/query/pipeline; make me diagnose it first.
7. PERFORMANCE — CPU/memory/I-O/network/latency/throughput/concurrency/storage/caching/scalability/cost.
8. PRODUCTION — failure modes, observability, retries, idempotency, consistency, security, rollback, incident response.
9. CODE REVIEW — correctness/readability/maintainability/complexity/error handling/testing/concurrency/performance; identify issues, ask how I'd fix them, only then help.
10. SYSTEM THINKING — connect to OS/networking/databases/distributed systems/cloud/DE/performance/inference where genuinely relevant.
11. MISCONCEPTIONS — be aggressive about detecting shallow or memorized understanding.
12. NO PREMATURE HELP — no lectures, full solutions, code dumps, or generic praise before I attempt it.
13. SCORE ME — Definition/Mechanism/Implementation/Debugging/Trade-offs/Production/Performance out of 10 each, then classify: Memorized / Functional / Solid / Strong / Production-ready.
14. GAP LIST — up to 5 specific gaps, each with what I misunderstood, what to revisit, and the question I should be able to answer afterward.
15. RETENTION — finish with 3 retrieval questions for tomorrow, no notes.

Optimize for making me actually competent, not for making me feel smart.`;

  if(link.u && link.u.startsWith("internal:")){
    const targetId = link.u.split(":")[1];
    const span = el("span","seq-pill seq-pill-internal "+kind, link.n+" ↪");
    span.onclick = ()=>{ activePhaseId = targetId; renderApp(); window.scrollTo(0,0); };
    return span;
  }
  const a = document.createElement("a");
  a.className = "seq-pill "+kind;
  a.href = link.u; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = link.n + ' <span class="seq-go">↗</span>';
  return a;
}

function renderApp(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  const stats = overallStats();

  /* ---- header ---- */
  const header = el("header","top");
  const topRow = el("div","top-row");

  const titleBlock = el("div","title-block");
  titleBlock.appendChild(el("div","mono tag","LEARNING PLAN"));
  titleBlock.appendChild(el("h1",null,"Data Engineering → Data Intelligence → AI Platform"));
  titleBlock.appendChild(el("p","strategy","Six slices (S1–S6), each shipped as v1 in 2–3 weeks and deepened later: hireable mid-level DE/AE first, growing into the data intelligence engineer role (clean models, curated context, evals, agents). Inference internals stay as the Deep track, after the job switch. Phases are a reference library: Required now / Later / Deep track."));
  topRow.appendChild(titleBlock);

  const prog = el("div","overall-progress");
  prog.appendChild(el("div","num", stats.pct+"%"));
  prog.appendChild(el("div","lbl", stats.done+" / "+stats.total+" Required-now items"));
  const deep = overallStats("Deep track");
  prog.appendChild(el("div","lbl", "Deep track (separate): "+deep.done+" / "+deep.total));
  const bt = el("div","bar-track"); const bf = el("div","bar-fill"); bf.style.width = stats.pct+"%"; bt.appendChild(bf);
  prog.appendChild(bt);
  topRow.appendChild(prog);
  header.appendChild(topRow);

  /* allocation strip */
  const alloc = el("div","alloc");
  alloc.appendChild(el("span","alloc-label","TIME ALLOCATION"));
  const segs = renderAllocBar();
  const bar = el("div","alloc-bar");
  segs.forEach(([k,v])=>{ const s=el("div","alloc-seg"); s.style.width=v+"%"; s.style.background=`var(--${k.toLowerCase()})`; bar.appendChild(s); });
  alloc.appendChild(bar);
  const legend = el("div","alloc-legend");
  segs.forEach(([k,v])=>{
    const item = el("span","",`<span class="dot" style="background:var(--${k.toLowerCase()})"></span>${TRACKS[k].label} ${v}%`);
    legend.appendChild(item);
  });
  alloc.appendChild(legend);
  const toggle = el("div","alloc-toggle");
  [["current","Before job switch"],["after","After job switch"],["later","Deep track (+6–18mo)"]].forEach(([k,l])=>{
    const b = el("button","",l);
    if(allocView===k) b.classList.add("active");
    b.onclick = ()=>{ allocView=k; renderApp(); };
    toggle.appendChild(b);
  });
  alloc.appendChild(toggle);
  header.appendChild(alloc);

  /* tabs */
  const tabs = el("nav","tabs");
  [["roadmap","Roadmap"],["system","Study System"],["prompts","Reviewer Prompts"]].forEach(([k,l])=>{
    const b = el("button","",l);
    if(activeTab===k) b.classList.add("active");
    b.onclick = ()=>{ activeTab=k; renderApp(); };
    tabs.appendChild(b);
  });
  header.appendChild(tabs);
  app.appendChild(header);

  /* ---- body ---- */
  const body = el("div","body");

  if(activeTab==="roadmap"){
    body.appendChild(renderSidebar());
    body.appendChild(renderMainPhase());
  } else if(activeTab==="system"){
    body.appendChild(renderSystemTab());
  } else {
    body.appendChild(renderPromptsTab());
  }

  app.appendChild(body);
}

function renderSidebar(){
  const aside = el("aside");

  const filterRow = el("div","filter-row");
  const allChip = el("button","filter-chip"+(activeTrackFilter==="ALL"?" active":""),"All "+PHASES.length);
  allChip.style.background = activeTrackFilter==="ALL" ? "var(--muted-2)" : "transparent";
  allChip.onclick=()=>{activeTrackFilter="ALL"; renderApp();};
  filterRow.appendChild(allChip);
  Object.keys(TRACKS).forEach(k=>{
    const count = PHASES.filter(p=>p.track===k).length;
    const chip = el("button","filter-chip"+(activeTrackFilter===k?" active":""), TRACKS[k].label.split(" ")[0]+" "+count);
    if(activeTrackFilter===k){ chip.style.background = TRACKS[k].color; chip.style.color="#14171c"; }
    chip.onclick=()=>{activeTrackFilter=k; renderApp();};
    filterRow.appendChild(chip);
  });
  aside.appendChild(filterRow);

  const list = el("div","phase-list");
  const shown = PHASES.filter(p=> activeTrackFilter==="ALL" || p.track===activeTrackFilter);
  shown.forEach((p,i)=>{
    const item = el("div","phase-item"+(p.id===activePhaseId?" active":""));
    const dot = el("span","track-dot"); dot.style.background = TRACKS[p.track].color;
    item.appendChild(dot);
    item.appendChild(el("span","idx", String(i+1).padStart(2,"0")));
    item.appendChild(el("span","name", p.title));
    item.appendChild(el("span","prio-pill prio-"+p.prio.split(" ")[0].toLowerCase(), p.prio==="Required now"?"NOW":p.prio==="Deep track"?"DEEP":"LATER"));
    const tot = phaseTotal(p), done = phaseDone(p);
    item.appendChild(el("span","pct", tot? Math.round(done/tot*100)+"%":"—"));
    item.onclick = ()=>{ activePhaseId = p.id; renderApp(); };
    list.appendChild(item);
  });
  aside.appendChild(list);
  return aside;
}

function renderMainPhase(){
  const main = el("main");
  const p = PHASES.find(x=>x.id===activePhaseId) || PHASES[0];

  const ph = el("div","phase-header");
  const left = el("div");
  left.appendChild(el("div","phase-eyebrow", TRACKS[p.track].label.toUpperCase()));
  left.appendChild(el("h2", null, p.title));
  ph.appendChild(left);
  ph.appendChild(el("div","badge", p.time));
  main.appendChild(ph);
  main.appendChild(el("p","slice-line", "Slice: "+p.slice+" · "+p.prio+(p.note?" — "+p.note:"")));

  main.appendChild(el("p","goal", p.goal));

  if(p.focus && p.focus.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Focus"));
    const tags = el("div","focus-tags");
    p.focus.forEach(f=> tags.appendChild(el("span","focus-tag", f)));
    sec.appendChild(tags);
    main.appendChild(sec);
  }

  if(p.resources && p.resources.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Resources"));
    const list = el("div","res-list");
    p.resources.forEach(r=>{
      const a = document.createElement("a");
      a.className="res-item"; a.href=r.u; a.target="_blank"; a.rel="noopener";
      a.innerHTML = `<span class="r-name">${r.n}</span><span class="r-go">open ↗</span>`;
      list.appendChild(a);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  }

  if(p.coursePlan && p.coursePlan.length){
    const sec = el("section","block");
    sec.style.maxWidth = "760px";
    sec.appendChild(el("h3",null,"Primary course — modules to complete, in order"));
    const banner = el("div","fb-primary-banner","★ Primary curriculum — sections marked \"survey layer only\" or \"skip\" are called out explicitly below");
    sec.appendChild(banner);
    p.coursePlan.forEach((step,i)=>{
      const card = el("div","fb-step");
      const head = el("div","fb-step-head");
      head.appendChild(el("span","fb-step-num", String(i+1).padStart(2,"0")));
      head.appendChild(el("span","fb-step-title", step.section));
      if(step.courseUrl){
        const a = document.createElement("a");
        a.className="fb-step-open"; a.href=step.courseUrl; a.target="_blank"; a.rel="noopener";
        a.textContent="Open course ↗";
        head.appendChild(a);
      }
      card.appendChild(head);

      const body = el("div","fb-step-body");
      if(step.watch && step.watch.length){
        const wl = el("div","fb-watch-list");
        step.watch.forEach(w=>{
          const row = el("div","fb-watch-row");
          row.appendChild(el("span","fb-dur", w.dur||""));
          row.appendChild(el("span",null, w.n));
          wl.appendChild(row);
        });
        body.appendChild(wl);
      }
      if(step.optional && step.optional.length){
        const optNames = step.optional.map(o=> o.n + (o.dur&&o.dur!=="—" ? " ("+o.dur+")" : "")).join(", ");
        body.appendChild(el("div","fb-optional-note", "Optional: "+optNames));
      }
      if(step.total){
        body.appendChild(el("div","fb-step-total", step.total));
      }
      if(step.skipNote){
        body.appendChild(el("div","fb-skip-note", step.skipNote));
      }
      card.appendChild(body);
      sec.appendChild(card);
    });
    main.appendChild(sec);
  }

  if(p.filler && p.filler.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Filler — Real Python (secondary, for the few gaps the primary course doesn't cover)"));
    sec.appendChild(el("div","filler-hint","Not sequenced against the primary course above — short standalone articles for whatever's left uncovered. Read whichever one you need, whenever you need it."));
    const list = el("div","res-list");
    p.filler.forEach(r=>{
      const a = document.createElement("a");
      a.className="res-item"; a.href=r.u; a.target="_blank"; a.rel="noopener";
      a.innerHTML = `<span class="r-name">${r.n}</span><span class="r-go">open ↗</span>`;
      list.appendChild(a);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  }

  if(p.deepRef && p.deepRef.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Deep reference — Fluent Python, 2nd Edition (read only when you hit a wall)"));
    sec.appendChild(el("div","filler-hint","Not a course to finish — open the specific chapter only when a concept from the primary course needs more written depth than an interactive lesson gives it."));
    const list = el("div","res-list");
    p.deepRef.forEach(r=>{
      const a = document.createElement("a");
      a.className="res-item"; a.href=r.u; a.target="_blank"; a.rel="noopener";
      a.innerHTML = `<span class="r-name">${r.n}</span><span class="r-go">open ↗</span>`;
      list.appendChild(a);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  }

  if(p.sequence && p.sequence.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Study sequence (Real Python ↔ primary course mapping) — every item links directly to its page"));
    const list = el("div","seq-list");
    p.sequence.forEach((s,i)=>{
      const row = el("div","seq-row");
      row.appendChild(el("span","seq-num", String(i+1).padStart(2,"0")));
      const bodyEl = el("div","seq-body");

      const rpCol = el("div","seq-col");
      rpCol.appendChild(el("span","seq-col-label","RP"));
      const rpWrap = el("div","seq-pill-wrap");
      if(s.rpLinks && s.rpLinks.length){
        s.rpLinks.forEach(link=> rpWrap.appendChild(makeSeqPill(link,"rp")));
      } else {
        rpWrap.appendChild(el("span","seq-pill seq-pill-empty","— no RP equivalent"));
      }
      rpCol.appendChild(rpWrap);
      bodyEl.appendChild(rpCol);

      const arrow = el("div","seq-arrow-row","↓");
      bodyEl.appendChild(arrow);

      const fbCol = el("div","seq-col");
      fbCol.appendChild(el("span","seq-col-label","FB / COURSE"));
      const fbWrap = el("div","seq-pill-wrap");
      if(s.fbLinks && s.fbLinks.length){
        s.fbLinks.forEach(link=> fbWrap.appendChild(makeSeqPill(link,"fb")));
      } else {
        fbWrap.appendChild(el("span","seq-pill seq-pill-empty","— no FB equivalent"));
      }
      fbCol.appendChild(fbWrap);
      bodyEl.appendChild(fbCol);

      bodyEl.appendChild(el("div","seq-note", s.note));
      row.appendChild(bodyEl);
      list.appendChild(row);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  }

  if(p.checklist && p.checklist.length){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Exit checklist"));
    const list = el("div","checklist");
    p.checklist.forEach((item,i)=>{
      const key = p.id+"::"+i;
      const row = el("label","check-row"+(checked[key]?" checked":""));
      const cb = document.createElement("input");
      cb.type="checkbox"; cb.checked = !!checked[key];
      cb.onchange = ()=>{ checked[key]=cb.checked; saveProgress(); renderApp(); };
      row.appendChild(cb);
      row.appendChild(el("span",null,item));
      list.appendChild(row);
    });
    sec.appendChild(list);
    main.appendChild(sec);
  }

  if(p.ignore){
    const sec = el("section","block");
    sec.appendChild(el("h3",null,"Explicitly ignore for now"));
    sec.appendChild(el("div","ignore-note", p.ignore));
    main.appendChild(sec);
  }

  return main;
}

function renderSystemTab(){
  const main = el("main");
  main.appendChild(el("div","phase-eyebrow","OPERATING MODEL"));
  main.appendChild(el("h2",null,"How the learning itself works"));
  main.appendChild(el("p","goal","The weekly cycle, the per-concept workflow, the resource hierarchy, and the priority order to fall back on if time gets tight."));

  const grid = el("div","sys-grid");

  const c1 = el("div","card");
  c1.appendChild(el("h4",null,"Weekly 6-day cycle"));
  const ol = document.createElement("ol");
  WEEKLY.cycle.forEach(([d,desc])=>{ const li=document.createElement("li"); li.innerHTML=`<strong>${d}:</strong> ${desc}`; ol.appendChild(li); });
  c1.appendChild(ol);
  grid.appendChild(c1);

  const c2 = el("div","card");
  c2.appendChild(el("h4",null,"Per-concept workflow"));
  const ol2 = document.createElement("ol");
  WEEKLY.concept.forEach(s=>{ const li=document.createElement("li"); li.textContent=s; ol2.appendChild(li); });
  c2.appendChild(ol2);
  grid.appendChild(c2);

  const c3 = el("div","card");
  c3.appendChild(el("h4",null,"Resource priority (when sources conflict)"));
  const flow = WEEKLY.hierarchy.join("\n      ↓\n");
  c3.appendChild(el("div","cycle-flow", flow));
  c3.appendChild(el("p",null,"The LLM is deliberately last — excellent at explaining, occasionally excellent at confidently inventing."));
  grid.appendChild(c3);

  const c4 = el("div","card");
  c4.appendChild(el("h4",null,"Non-negotiable rules"));
  const ul = document.createElement("ul");
  ["One primary resource per subject — secondary resources for specific gaps only","Every topic needs 4 levels: definition, mechanism, engineering use, trade-offs","LLM is the reviewer, not the teacher","Build before you feel ready — and always break what you build"].forEach(s=>{ const li=document.createElement("li"); li.textContent=s; ul.appendChild(li); });
  c4.appendChild(ul);
  grid.appendChild(c4);

  main.appendChild(grid);

  const sec = el("section","block");
  sec.style.marginTop="30px"; sec.style.maxWidth="920px";
  sec.appendChild(el("h3",null,"Final priority order (if time is limited)"));
  const tierList = el("div","tier-list");
  TIERS.forEach(t=>{
    const row = el("div","tier");
    row.appendChild(el("div","tnum", t.n));
    const items = el("div","titems");
    t.items.forEach(i=> items.appendChild(el("span","titem", i)));
    row.appendChild(items);
    tierList.appendChild(row);
  });
  sec.appendChild(tierList);
  main.appendChild(sec);

  return main;
}

function renderPromptsTab(){
  const main = el("main");
  main.appendChild(el("div","phase-eyebrow","LLM REVIEWER MODES"));
  main.appendChild(el("h2",null,"Copy-paste prompts for the review step"));
  main.appendChild(el("p","goal","Use the reviewer prompt after learning any concept. Use the other two once you reach larger projects or performance work."));

  const prompts = [
    {title:"Universal concept reviewer", text:REVIEWER_PROMPT},
    {title:"Code / architecture review mode", text:CODE_REVIEW_PROMPT},
    {title:"Performance review mode", text:PERF_REVIEW_PROMPT},
  ];

  prompts.forEach((p,idx)=>{
    const card = el("div","prompt-card");
    const head = el("div","p-head");
    head.appendChild(el("h4",null,p.title));
    const btn = el("button","copy-btn","Copy");
    btn.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(p.text); btn.textContent="Copied"; btn.classList.add("copied"); }
      catch(e){ btn.textContent="Select & copy manually"; }
      setTimeout(()=>{ btn.textContent="Copy"; btn.classList.remove("copied"); }, 1800);
    };
    head.appendChild(btn);
    card.appendChild(head);
    const pre = document.createElement("pre");
    pre.textContent = p.text;
    card.appendChild(pre);
    main.appendChild(card);
  });

  return main;
}

/* ======================= INIT ======================= */
(async function init(){
  await loadProgress();
  renderApp();
})();
</script>
</body>
